[project]
name = "email-review"
version = "0.1.0"
description = "Browse the email-digest skill's classification of recent inbox messages by bucket, with commentary and archive recommendation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "nh3>=0.2",
]

[project.scripts]
email-review = "email_review.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_review"]
