<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Inbox Digest &amp; Review">
  <rect width="240" height="160" rx="12" fill="#20232a"/>

  <!-- envelope glyph -->
  <g transform="translate(14,14)">
    <rect x="0" y="0" width="26" height="18" rx="3" fill="none" stroke="#c9d1d9" stroke-width="1.6"/>
    <path d="M1 2l11 8 11 -8" fill="none" stroke="#c9d1d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="48" y="27" font-family="sans-serif" font-size="13" font-weight="600" fill="#f0f2f5">Inbox Digest</text>

  <!-- bucket rows: accent bar + label + mock count pill -->
  <g font-family="sans-serif" font-size="10" fill="#c9d1d9">
    <rect x="14" y="46" width="3" height="14" rx="1.5" fill="#e0765a"/>
    <text x="24" y="56">Reply needed</text>
    <rect x="190" y="47" width="22" height="12" rx="6" fill="#e0765a"/>
    <text x="201" y="56" font-size="9" fill="#20232a" text-anchor="middle">3</text>

    <rect x="14" y="68" width="3" height="14" rx="1.5" fill="#e0b34a"/>
    <text x="24" y="78">Decision needed</text>
    <rect x="190" y="69" width="22" height="12" rx="6" fill="#e0b34a"/>
    <text x="201" y="78" font-size="9" fill="#20232a" text-anchor="middle">1</text>

    <rect x="14" y="90" width="3" height="14" rx="1.5" fill="#5aa7e0"/>
    <text x="24" y="100">Waiting on reply</text>
    <rect x="190" y="91" width="22" height="12" rx="6" fill="#5aa7e0"/>
    <text x="201" y="100" font-size="9" fill="#20232a" text-anchor="middle">5</text>

    <rect x="14" y="112" width="3" height="14" rx="1.5" fill="#5a6570"/>
    <text x="24" y="122">Marketing / spam</text>
    <rect x="190" y="113" width="22" height="12" rx="6" fill="#5a6570"/>
    <text x="201" y="122" font-size="9" fill="#e8ebef" text-anchor="middle">12</text>
  </g>

  <text x="14" y="146" font-family="sans-serif" font-size="9" fill="#7d8590">sorted • triaged • archived</text>
</svg>
