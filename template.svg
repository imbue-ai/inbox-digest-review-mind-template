<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Inbox Digest and Review: a flat inbox sorted into labelled buckets, each message cleared with one click">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="1" stop-color="#141b24"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4757"/>
      <stop offset="1" stop-color="#3a4757" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="240" height="160" rx="12" fill="url(#bg)"/>

  <!-- left: the undifferentiated inbox, every line alike and fading out -->
  <g>
    <rect x="18" y="26" width="72" height="7" rx="3.5" fill="url(#fade)"/>
    <rect x="18" y="39" width="72" height="7" rx="3.5" fill="url(#fade)"/>
    <rect x="18" y="52" width="72" height="7" rx="3.5" fill="url(#fade)"/>
    <rect x="18" y="65" width="72" height="7" rx="3.5" fill="url(#fade)"/>
    <rect x="18" y="78" width="72" height="7" rx="3.5" fill="url(#fade)"/>
    <rect x="18" y="91" width="72" height="7" rx="3.5" fill="url(#fade)"/>
    <rect x="18" y="104" width="72" height="7" rx="3.5" fill="url(#fade)"/>
    <rect x="18" y="117" width="72" height="7" rx="3.5" fill="url(#fade)"/>
    <rect x="18" y="130" width="72" height="7" rx="3.5" fill="url(#fade)"/>
  </g>

  <!-- the sort: one flat list fanning into labelled groups -->
  <g fill="none" stroke="#4d5f75" stroke-width="1.4" stroke-linecap="round">
    <path d="M96 80 C 110 80, 110 40, 124 40"/>
    <path d="M96 80 C 110 80, 110 72, 124 72"/>
    <path d="M96 80 C 110 80, 110 104, 124 104"/>
  </g>

  <!-- right: three buckets, each with a colour-coded spine and a summary line -->
  <g>
    <rect x="128" y="26" width="94" height="30" rx="5" fill="#212c3a"/>
    <rect x="128" y="26" width="3" height="30" rx="1.5" fill="#e0685f"/>
    <rect x="139" y="34" width="46" height="5" rx="2.5" fill="#8b9bb0"/>
    <rect x="139" y="44" width="70" height="4" rx="2" fill="#4a586b"/>

    <rect x="128" y="62" width="94" height="30" rx="5" fill="#212c3a"/>
    <rect x="128" y="62" width="3" height="30" rx="1.5" fill="#d9a441"/>
    <rect x="139" y="70" width="34" height="5" rx="2.5" fill="#8b9bb0"/>
    <rect x="139" y="80" width="62" height="4" rx="2" fill="#4a586b"/>

    <rect x="128" y="98" width="94" height="30" rx="5" fill="#212c3a"/>
    <rect x="128" y="98" width="3" height="30" rx="1.5" fill="#5aa9a3"/>
    <rect x="139" y="106" width="52" height="5" rx="2.5" fill="#8b9bb0"/>
    <rect x="139" y="116" width="40" height="4" rx="2" fill="#4a586b"/>
  </g>

  <!-- the one-click clear -->
  <g transform="translate(203 35)">
    <circle cx="6" cy="6" r="8.5" fill="#2f6f5f"/>
    <path d="M2.4 6.2 L5 8.8 L9.6 3.6" fill="none" stroke="#d8f3e9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="18" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#7c8ba1">inbox digest &amp; review</text>
</svg>
