[project]
name = "chat-lab"
version = "0.1.0"
description = "Stripped-down fork of the chat panel for hacking on the chat UI in isolation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "requests>=2.32",
]

[project.scripts]
chat-lab = "chat_lab.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_lab"]
